version: '3.8'

# i9Hub SaaS + Admin Panel v1.1.0 - Stack Completa (Corrigida)

services:
  i9hub-db:
    image: postgres:16-alpine
    container_name: i9hub-db
    environment:
      POSTGRES_USER: i9hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: i9hub_saas
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U i9hub -d i9hub_saas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default
    restart: unless-stopped

  i9hub-redis:
    image: redis:7-alpine
    container_name: i9hub-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - default
    restart: unless-stopped

  i9hub-app:
    image: ghcr.io/nataoliver/i9hub-saas:latest
    container_name: i9hub-app
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://i9hub:${POSTGRES_PASSWORD}@i9hub-db:5432/i9hub_saas
      REDIS_URL: redis://i9hub-redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      WA_GATEWAY_URL: ${WA_GATEWAY_URL:-}
      WA_GATEWAY_API_KEY: ${WA_GATEWAY_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_API_URL: ${ASAAS_API_URL:-https://api.asaas.com/v3}
      ASAAS_WEBHOOK_URL: ${ASAAS_WEBHOOK_URL:-https://app.i9ads.com.br/api/webhooks/asaas}
      ASAAS_WEBHOOK_SECRET: ${ASAAS_WEBHOOK_SECRET:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=zilefnet"
      - "traefik.http.routers.i9hub.rule=Host(`app.i9ads.com.br`)"
      - "traefik.http.routers.i9hub.entrypoints=websecure"
      - "traefik.http.routers.i9hub.tls=true"
      - "traefik.http.routers.i9hub.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.i9hub.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - default
      - zilefnet
    restart: unless-stopped
    depends_on:
      i9hub-db:
        condition: service_healthy
      i9hub-redis:
        condition: service_healthy

  i9hub-worker:
    image: ghcr.io/nataoliver/i9hub-saas:latest
    container_name: i9hub-worker
    command: ["node", "backend/src/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://i9hub:${POSTGRES_PASSWORD}@i9hub-db:5432/i9hub_saas
      REDIS_URL: redis://i9hub-redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      WA_GATEWAY_URL: ${WA_GATEWAY_URL:-}
      WA_GATEWAY_API_KEY: ${WA_GATEWAY_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
    networks:
      - default
    restart: unless-stopped
    depends_on:
      i9hub-db:
        condition: service_healthy
      i9hub-redis:
        condition: service_healthy

  i9hub-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: i9hub-admin-panel
    environment:
      NODE_ENV: production
      PORT: "3001"
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_ENV: ${ASAAS_ENV:-production}
      ASAAS_WEBHOOK_SECRET: ${ASAAS_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.stackmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-i9hub@i9mail.com.br}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-i9Hub}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-i9hub@i9mail.com.br}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - admin_data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=zilefnet"
      - "traefik.http.routers.i9hub-admin.rule=Host(`rcs.i9ads.com.br`)"
      - "traefik.http.routers.i9hub-admin.entrypoints=websecure"
      - "traefik.http.routers.i9hub-admin.tls=true"
      - "traefik.http.routers.i9hub-admin.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.i9hub-admin.loadbalancer.server.port=3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - default
      - zilefnet
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    volumes:
      - kuma_data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=zilefnet"
      - "traefik.http.routers.kuma.rule=Host(`status.i9ads.com.br`)"
      - "traefik.http.routers.kuma.entrypoints=websecure"
      - "traefik.http.routers.kuma.tls=true"
      - "traefik.http.routers.kuma.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.kuma.loadbalancer.server.port=3001"
    networks:
      - zilefnet
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  kuma_data:
  admin_data:

networks:
  zilefnet:
    external: true
    name: zilefnet
