version: '3.8'

# ═══════════════════════════════════════════════════════════
# i9Hub Admin Panel v1.1.0 - Standalone Docker Compose
# Uso: docker compose -f docker-compose.standalone.yml up -d --build
# ═══════════════════════════════════════════════════════════

services:
  i9hub-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: i9hub-admin-panel
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Asaas
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_ENV: ${ASAAS_ENV:-production}
      ASAAS_WEBHOOK_SECRET: ${ASAAS_WEBHOOK_SECRET:-}
      # SMTP
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-i9Hub}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      # Gemini AI
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Segurança
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - admin_data:/app/data
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  admin_data: